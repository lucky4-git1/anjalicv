<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjali — Botanical Editorial Hero</title>

  <!-- Google Fonts: Poppins (Headline & Geometric Sans) & Inter (UI Details) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ==========================================================================
       CSS CUSTOM PROPERTIES & BASE DESIGN TOKENS
       ========================================================================== */
    :root {
      --bg-page: #F9EAE6;
      --bg-canvas: #FFFFFF;
      --bg-pink-circle: #FDE8EC;
      --text-headline: #161616;
      --text-muted: #767676;
      --border-light: #E5E5E5;
      --border-active: #BDBDBD;
      --dot-rose: #E58AA0;
      --dot-grey: #E5E5E5;
      --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-window: 6px;
      --radius-pill: 9999px;
      --shadow-window: 0 25px 70px rgba(0, 0, 0, 0.07), 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: var(--bg-page);
      font-family: var(--font-body);
      color: var(--text-headline);
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2.5vw, 40px);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       BROWSER WINDOW CONTAINER
       ========================================================================== */
    .browser-frame {
      width: 100%;
      max-width: 1240px;
      background-color: var(--bg-canvas);
      border-radius: var(--radius-window);
      box-shadow: var(--shadow-window);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Window Top Bar with Three Operating System Control Dots */
    .browser-top-bar {
      height: 32px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #F1F1F1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 7px;
      user-select: none;
      flex-shrink: 0;
      z-index: 20;
    }

    .window-dot {
      width: 8.5px;
      height: 8.5px;
      border-radius: 50%;
    }

    .window-dot.dot-primary {
      background-color: var(--dot-rose);
    }

    .window-dot.dot-secondary {
      background-color: var(--dot-grey);
    }

    /* ==========================================================================
       HERO CANVAS LAYOUT & STACKING ISOLATION
       ========================================================================== */
    .hero-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10.4;
      min-height: 540px;
      background-color: var(--bg-canvas);
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* ── LAYER 1: Topographic Contour SVG Lines (z-index: 1) ── */
    .contour-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.58;
    }

    .contour-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── LAYER 10: Canvas Top Navigation Header (z-index: 10) ── */
    .canvas-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(20px, 3.2vw, 36px) clamp(24px, 3.8vw, 44px) 0;
    }

    /* Logo Brand Group */
    .logo-group {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--text-headline);
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #161616;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transition: transform 0.25s ease;
    }

    .logo-badge:hover {
      transform: scale(1.05);
    }

    .logo-badge svg {
      width: 16px;
      height: 16px;
      fill: #FFFFFF;
    }

    .logo-text {
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #161616;
    }

    /* Central Nav Pills */
    .nav-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pill {
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-muted);
      text-decoration: none;
      padding: 5.5px 17px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      transition: all 0.22s ease;
    }

    .nav-pill:hover {
      color: #161616;
      border-color: var(--border-active);
      background-color: #FFFFFF;
    }

    .nav-pill.active {
      color: #161616;
      border-color: #D6D6D6;
      background-color: #FFFFFF;
    }

    /* Header Actions (Search & Plus) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border-light);
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #161616;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background-color: #FFFFFF;
      border-color: var(--border-active);
      transform: scale(1.05);
    }

    .icon-btn svg {
      width: 13.5px;
      height: 13.5px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    /* ==========================================================================
       HERO CENTERPIECE (HEADLINE + CIRCLE + FLOWER)
       ========================================================================== */
    .hero-centerpiece {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* ── LAYER 2: Giant Headline "Anjali" (z-index: 2) ── */
    .headline-wrap {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 52%;
      transform: translateY(-50%);
      z-index: 2;
      pointer-events: none;
      padding: 0 4%;
    }

    .headline-text {
      font-family: var(--font-display);
      font-size: clamp(5.2rem, 15.6vw, 13.2rem);
      font-weight: 700;
      color: var(--text-headline);
      letter-spacing: -0.04em;
      line-height: 0.88;
      display: inline-block;
      white-space: nowrap;
      margin: 0 auto;
    }

    .char {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* ── LAYER 3: Soft Pastel Pink Disc (z-index: 3) ── */
    .flower-disc {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(230px, 29vw, 370px);
      height: clamp(230px, 29vw, 370px);
      border-radius: 50%;
      background-color: var(--bg-pink-circle);
      z-index: 3;
      pointer-events: none;
      will-change: transform;
    }

    /* ── LAYER 4: The Hero Stargazer Lily Cutout (z-index: 4) ── */
    .flower-stage {
      position: absolute;
      top: 47%;
      left: 49.5%;
      transform: translate(-50%, -50%);
      z-index: 4;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(340px, 45vw, 550px);
      height: clamp(340px, 45vw, 550px);
      will-change: transform;
    }

    .flower-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 22px 32px rgba(0, 0, 0, 0.13)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.05));
      pointer-events: auto;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      transition: filter 0.3s ease;
      will-change: transform, opacity;
    }

    .flower-img:active {
      cursor: grabbing;
    }

    /* ==========================================================================
       CANVAS BOTTOM BAR (z-index: 10)
       ========================================================================== */
    .canvas-footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(24px, 3.8vw, 44px) clamp(22px, 3.2vw, 38px);
    }

    /* Botanical Subject Thumbnail & Label */
    .subject-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-headline);
    }

    .subject-thumb {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid #ECECEC;
      overflow: hidden;
      background-color: #F8F8F8;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .subject-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .subject-name {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--text-headline);
      transition: opacity 0.25s ease;
    }

    /* Slider Arrows */
    .slider-arrows {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .arrow-btn {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      border: 1px solid var(--border-light);
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #161616;
      transition: all 0.2s ease;
    }

    .arrow-btn:hover {
      background-color: #FFFFFF;
      border-color: var(--border-active);
      transform: scale(1.06);
    }

    .arrow-btn:active {
      transform: scale(0.96);
    }

    .arrow-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* ==========================================================================
       RESPONSIVE ADAPTATIONS
       ========================================================================== */
    @media (max-width: 860px) {
      body {
        padding: 8px;
      }

      .browser-frame {
        border-radius: 4px;
      }

      .hero-canvas {
        aspect-ratio: auto;
        height: 88vh;
        min-height: 580px;
      }

      .nav-pills {
        display: none; /* Mobile collapse */
      }

      .headline-text {
        font-size: clamp(4.4rem, 17vw, 7.8rem);
      }

      .flower-stage {
        width: clamp(280px, 68vw, 420px);
        height: clamp(280px, 68vw, 420px);
      }

      .flower-disc {
        width: clamp(190px, 48vw, 290px);
        height: clamp(190px, 48vw, 290px);
      }
    }

    @media (max-width: 480px) {
      .header-actions {
        gap: 6px;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
      }
    }

    /* Accessibility: Respect Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .char, .flower-stage, .flower-disc, .flower-img {
        transform: none !important;
        opacity: 1 !important;
      }
    }
  </style>
</head>

        }
      ];

      let currentSlide = 0;
      let isTransitioning = false;

      // DOM Elements
      const flowerImg = document.getElementById("flowerImg");
      const flowerStage = document.getElementById("flowerStage");
      const flowerDisc = document.getElementById("flowerDisc");
      const headlineWrap = document.getElementById("headlineWrap");
      const headlineChars = document.querySelectorAll(".char");
      const subjectName = document.getElementById("subjectName");
      const subjectThumbImg = document.getElementById("subjectThumbImg");
      const prevBtn = document.getElementById("prevSlideBtn");
      const nextBtn = document.getElementById("nextSlideBtn");
      const heroCanvas = document.getElementById("heroCanvas");
      const canvasHeader = document.querySelector(".canvas-header");
      const canvasFooter = document.querySelector(".canvas-footer");

      // ── 1. ENTRANCE TIMELINE ON LOAD ──
      if (!prefersReducedMotion && typeof gsap !== "undefined") {
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

        // Initial setup
        gsap.set(headlineChars, { opacity: 0, y: 70, rotateZ: 2 });
        gsap.set(flowerDisc, { scale: 0, opacity: 0 });
        gsap.set(flowerStage, { scale: 0.86, rotation: -8, opacity: 0 });
        gsap.set([canvasHeader, canvasFooter], { opacity: 0, y: (i) => (i === 0 ? -12 : 12) });

        tl
          // Headline letters rise with soft stagger
          .to(headlineChars, {
            opacity: 1,
            y: 0,
            rotateZ: 0,
            duration: 1.1,
            stagger: 0.055,
            ease: "back.out(1.15)"
          }, 0.15)

          // Soft pink disc scales in
          .to(flowerDisc, {
            opacity: 1,
            scale: 1,
            duration: 1.25,
            ease: "back.out(1.35)"
          }, 0.3)

          // Flower rotates in and settles
          .to(flowerStage, {
            opacity: 1,
            scale: 1,
            rotation: 0,
            duration: 1.35,
            ease: "power3.out"
          }, 0.4)

          // Top and bottom UI fade in smoothly
          .to([canvasHeader, canvasFooter], {
            opacity: 1,
            y: 0,
            duration: 0.8,
            stagger: 0.1,
            ease: "power2.out"
          }, 0.85);

        // ── 2. GENTLE IDLE FLOAT LOOP ──
        gsap.to(flowerImg, {
          y: -7,
          rotation: 0.6,
          duration: 3.2,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
          delay: 1.8
        });

        // ── 3. BUTTER-SMOOTH MOUSE-MOVE PARALLAX ──
        const quickFlowerX = gsap.quickTo(flowerStage, "x", { duration: 0.65, ease: "power2.out" });
        const quickFlowerY = gsap.quickTo(flowerStage, "y", { duration: 0.65, ease: "power2.out" });
        const quickDiscX = gsap.quickTo(flowerDisc, "x", { duration: 0.85, ease: "power2.out" });
        const quickDiscY = gsap.quickTo(flowerDisc, "y", { duration: 0.85, ease: "power2.out" });
        const quickTextX = gsap.quickTo(headlineWrap, "x", { duration: 0.9, ease: "power2.out" });
        const quickTextY = gsap.quickTo(headlineWrap, "y", { duration: 0.9, ease: "power2.out" });

        heroCanvas.addEventListener("mousemove", (e) => {
          const rect = heroCanvas.getBoundingClientRect();
          const normX = ((e.clientX - rect.left) / rect.width) * 2 - 1; // -1 to 1
          const normY = ((e.clientY - rect.top) / rect.height) * 2 - 1; // -1 to 1

          quickFlowerX(normX * 13);
          quickFlowerY(normY * 11);

          quickDiscX(normX * 6);
          quickDiscY(normY * 5);

          quickTextX(normX * -4);
          quickTextY(normY * -3);
        });

        heroCanvas.addEventListener("mouseleave", () => {
          quickFlowerX(0);
          quickFlowerY(0);
          quickDiscX(0);
          quickDiscY(0);
          quickTextX(0);
          quickTextY(0);
        });
      }

      // ── 4. BOTANICAL SLIDER FUNCTIONALITY ──
      function goToSlide(index, direction = 1) {
        if (isTransitioning) return;
        isTransitioning = true;

        currentSlide = (index + slides.length) % slides.length;
        const target = slides[currentSlide];

        if (!prefersReducedMotion && typeof gsap !== "undefined") {
          const slideTl = gsap.timeline({
            onComplete: () => {
              isTransitioning = false;
            }
          });

          slideTl
            // Flower exit: slight rotation & fade
            .to(flowerImg, {
              opacity: 0,
              scale: 0.92,
              rotation: direction * 5,
              duration: 0.28,
              ease: "power2.in",
              onComplete: () => {
                flowerImg.src = target.image;
                flowerImg.alt = target.alt;
              }
            })
            // Fade out name label
            .to(subjectName, {
              opacity: 0,
              y: -4,
              duration: 0.18,
              onComplete: () => {
                subjectName.textContent = target.name;
                subjectThumbImg.src = target.thumb;
              }
            }, 0)
            // Name label fade back in
            .to(subjectName, {
              opacity: 1,
              y: 0,
              duration: 0.28,
              ease: "power2.out"
            })
            // Flower enter: soft ease in and settle
            .to(flowerImg, {
              opacity: 1,
              scale: 1,
              rotation: 0,
              duration: 0.45,
              ease: "power3.out"
            }, "-=0.15");
        } else {
          // Direct switch for reduced motion
          flowerImg.src = target.image;
          flowerImg.alt = target.alt;
          subjectName.textContent = target.name;
          subjectThumbImg.src = target.thumb;
          isTransitioning = false;
        }
      }

      prevBtn.addEventListener("click", () => goToSlide(currentSlide - 1, -1));
      nextBtn.addEventListener("click", () => goToSlide(currentSlide + 1, 1));

      // Keyboard navigation for slider
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") goToSlide(currentSlide - 1, -1);
        if (e.key === "ArrowRight") goToSlide(currentSlide + 1, 1);
      });
    });
  </script>
</body>
</html>
